name = "hex-gfq-ring-bench"
defaultTargets = ["hexgfqring_bench"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexGFqRing"
path = ".."

[[require]]
name = "lean-bench"
git = "https://github.com/kim-em/lean-bench.git"
rev = "master"

[[lean_exe]]
name = "hexgfqring_bench"
root = "HexGFqRing.Bench"

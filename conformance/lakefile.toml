name = "hex-gfq-ring-conformance"
defaultTargets = ["HexGFqRingConformance", "hexgfqring_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexGFqRing"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "5b3dc5d7789cb680d64f8f4046254f93b7424e4f"

[[lean_lib]]
name = "HexGFqRingConformance"
globs = ["HexGFqRing.Conformance"]

[[lean_exe]]
name = "hexgfqring_emit_fixtures"
root = "HexGFqRing.EmitFixtures"
